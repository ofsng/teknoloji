name: intro-packets

# Tanıtım kartları için OpenAlex kaynak paketlerini (anahtarlı) hazırlar ve iş çıktısı (artifact) olarak yükler.
# Depoya hiçbir şey yazmaz. Yerelde: gh run download <run> -n intro-packets -D .cache/intro
# Anahtarlı günlük kota yaklaşık 470 düğüme yetiyor (2026-11-23): paketler önceki başarılı çalışmanın
# artifact'ından devralınıp birikir; her gün kalan
# düğümlerle devam edilir; 429 alınınca o günkü çalışma durur. Tanıtımı yazılmış düğümler atlanır.

on:
  schedule:
    - cron: "41 1 * * *"   # her gün 01:41 UTC (OpenAlex günlük kotası gece yarısı UTC sıfırlanır)
  workflow_dispatch:
    inputs:
      min_depth:
        description: "En küçük derinlik"
        default: "3"
      max_depth:
        description: "En büyük derinlik"
        default: "8"

permissions:
  contents: read
  actions: read   # önceki çalışmanın paketlerini indirmek için

jobs:
  packets:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      KB_CONTACT_EMAIL: ${{ vars.KB_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Önceki paketler (son başarılı çalışmanın artifact'ı)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow intro-packets.yml --status success --limit 1 \
                 --json databaseId --jq '.[0].databaseId // empty')
          mkdir -p .cache/intro
          if [ -n "$prev" ]; then gh run download "$prev" --repo "$GITHUB_REPOSITORY" -n intro-packets -D .cache/intro || true; fi
          ls .cache/intro | wc -l

      - name: Kaynak paketleri
        run: |
          set +e
          for d in $(seq "${{ inputs.min_depth || 3 }}" "${{ inputs.max_depth || 8 }}"); do
            python3 tools/autokb.py intro --packets-only --depth "$d" | tail -c 2000
          done
          ls .cache/intro | wc -l

      - uses: actions/upload-artifact@v6
        with:
          name: intro-packets
          path: .cache/intro/
          retention-days: 30
